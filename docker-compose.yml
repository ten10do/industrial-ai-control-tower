services:
  postgres:
    image: industrial-ai-control-tower-postgres:16-pgvector-0.8.1
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-dotenv}
      POSTGRES_DB: ${POSTGRES_DB:-industrial_ai_control_tower}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_PUBLISHED:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_PUBLISHED:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT_PUBLISHED:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT_PUBLISHED:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:change-me-in-dotenv@postgres:5432/industrial_ai_control_tower}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DIAGNOSIS_ENABLED=${DIAGNOSIS_ENABLED:-true}
      - DIAGNOSIS_ARTIFACT_PATH=${DIAGNOSIS_ARTIFACT_PATH:-artifacts/diagnosis-v1.1.joblib}
      - DIAGNOSIS_MANIFEST_PATH=${DIAGNOSIS_MANIFEST_PATH:-artifacts/model_manifest-v1.1.json}
      - KNOWLEDGE_ENABLED=${KNOWLEDGE_ENABLED:-true}
      - KNOWLEDGE_INDEX_PATH=${KNOWLEDGE_INDEX_PATH:-knowledge/index-v1.json}
      - KNOWLEDGE_CORPUS_VERSION=${KNOWLEDGE_CORPUS_VERSION:-industrial-maintenance-corpus-v1}
      - KNOWLEDGE_EMBEDDING_VERSION=${KNOWLEDGE_EMBEDDING_VERSION:-local-hash-embedding-v1}
    command: ["sh", "-c", "alembic upgrade head && python -m app.knowledge.ingest --if-present && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build: ./simulator
    profiles: ["demo"]
    environment:
      - SIMULATOR_MQTT_BROKER_HOST=mosquitto
      - SIMULATOR_MQTT_BROKER_PORT=1883
      - SIMULATOR_DEVICE_ID=${SIMULATOR_DEVICE_ID:-MOTOR-001}
      - SIMULATOR_SAMPLE_INTERVAL=${SIMULATOR_SAMPLE_INTERVAL:-1.0}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT_PUBLISHED:-80}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  mosquitto-data:
