name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app tests

      - name: Test
        run: pytest

  # Phase 6.13-D1: the security/governance suites make database claims
  # (uniqueness, constraints, audit attribution, migration parity), so they
  # must run against real PostgreSQL with the pgvector extension available,
  # the same engine family production uses. A run without the database is a
  # skipped suite, and a skipped suite proves nothing — that is exactly the
  # gap this job closes.
  security-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Destructive-test safety: every database this run touches is a
      # disposable *_test database the suites create and drop themselves.
      ALARM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/alarm_security_test
      ASSETCONFIG_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/assetconfig_security_test
      OBSERVABILITY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/observability_security_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migration gate
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/platform_ci
        run: |
          alembic upgrade head
          alembic current
          # The gate compares live schema state with the version scripts, so
          # it can never pass by pointing at a stale hardcoded revision.
          alembic check
          current=$(alembic current | grep -oE '[0-9]{8}_[0-9]{2}' | head -1)
          head=$(alembic heads | grep -oE '[0-9]{8}_[0-9]{2}' | head -1)
          echo "migration gate: current=$current head=$head"
          if [ "$current" != "$head" ]; then
            echo "database is not at the head revision"
            exit 1
          fi

      - name: DB-backed security and governance suites
        run: |
          pytest tests/security -q -rs 2>&1 | tee /tmp/security_suite.log
          grep -E "^FAILED|^ERROR" /tmp/security_suite.log && exit 1 || true
          # 0 skipped due to missing PostgreSQL: any skip naming a
          # TEST_DATABASE_URL means the suite did not really run.
          if grep -E "TEST_DATABASE_URL is not configured" /tmp/security_suite.log; then
            echo "security suite skipped: test database was not provisioned"
            exit 1
          fi
          skipped=$(grep -oE "[0-9]+ skipped" /tmp/security_suite.log | awk '{s+=$1} END {print s+0}')
          if [ "$skipped" != "0" ]; then
            echo "unexpected skips in the security suite: $skipped"
            exit 1
          fi

      - name: DB-backed alarm / assetconfig / observability suites
        run: |
          pytest tests/incidents tests/assetconfig tests/test_observability_integration.py -q -rs 2>&1 | tee /tmp/db_suites.log
          grep -E "^FAILED|^ERROR" /tmp/db_suites.log && exit 1 || true
          if grep -E "TEST_DATABASE_URL is not configured" /tmp/db_suites.log; then
            echo "db-backed suite skipped: test database was not provisioned"
            exit 1
          fi

  # Phase 7 deterministic gate. Real-provider Agent acceptance is deliberately
  # not run in CI without credentials and is reported as NOT_RUN/BLOCKED by the
  # evaluation artifact rather than replaced with TestProvider scores.
  scenario-evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ALARM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/phase7_scenario_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend and simulator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ../simulator

      - name: Scenario contracts, evaluators, and metrics
        run: pytest tests/scenarios -q

      - name: DB-backed production-path and invariant scenarios
        run: |
          pytest \
            tests/incidents/test_phase7_wiring.py \
            tests/incidents/test_phase7_scenario_runner.py \
            tests/incidents/test_platform_reliability.py \
            tests/test_workflow.py \
            -q -rs 2>&1 | tee /tmp/phase7_scenarios.log
          if grep -E "TEST_DATABASE_URL is not configured" /tmp/phase7_scenarios.log; then
            echo "Phase 7 DB-backed scenario suite was skipped"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy simulator tests

      - name: Test
        run: pytest

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy industrial_ml tests

      - name: Unit and tiny-training smoke tests
        run: pytest

  deployment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Docker daemon availability
        run: |
          if docker info > /dev/null 2>&1; then
            echo "Docker daemon available"
          else
            echo "DOCKER_DAEMON_UNAVAILABLE"
          fi

      - name: Compose config validation
        run: |
          docker compose config --quiet || docker-compose config --quiet

      - name: Env template scan
        run: python scripts/validate_env.py .env.example --mode example

      - name: Secret scan
        run: python scripts/security_scan.py

      - name: Dockerfile lint
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          # Base images must be pinned to a version tag, never :latest.
          if grep -rEi '^FROM .*:latest' backend/Dockerfile frontend/Dockerfile; then
            echo "unpinned base image found"
            exit 1
          fi
          echo "Dockerfile lint passed"

      - name: Deployment scripts smoke test
        run: |
          bash -n scripts/backup_database.sh
          bash -n scripts/restore_database.sh
          # restore refuses to run without the explicit --yes flag
          if bash scripts/restore_database.sh /nonexistent.sql 2>/dev/null; then
            echo "restore must refuse without --yes"
            exit 1
          fi
          echo "scripts smoke test passed"

      - name: Deployment check unit tests
        run: |
          # requirements.txt carries runtime deps only, so pytest must be
          # requested explicitly or this step fails with "No module named pytest".
          pip install pytest -r backend/requirements.txt > /dev/null
          python -m pytest backend/tests/test_deployment_foundation.py -q

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate documentation structure
        run: |
          test -f README.md
          test -f docs/architecture/SYSTEM_ARCHITECTURE.md
          test -f docs/DOMAIN_MODEL.md
          test -f docs/AGENT_CONTRACTS.md
          test -f docs/API_CONTRACT.md
          test -f docs/TESTING_STRATEGY.md
          test -f docs/ROADMAP.md
          test -f docs/SIMULATOR.md
          test -f docs/ML_PIPELINE.md
          test -f docs/SECURITY_MODEL.md
          # ADR validation is structural rather than a hard-coded exact count,
          # so adding a legitimate ADR cannot break this job again. It checks
          # that ADR files exist, are numbered contiguously from ADR-001, and
          # each carries a matching "# ADR-NNN" heading. ADR_MIN_COUNT is a
          # floor, not an expectation: additions need no edit here, while an
          # accidental deletion still fails.
          ADR_MIN_COUNT=11
          adr_count=0
          adr_expected=1
          for adr in docs/adr/ADR-*.md; do
            if [ ! -e "$adr" ]; then
              echo "No ADR files found under docs/adr"
              exit 1
            fi
            adr_number=$(basename "$adr" .md | sed 's/^ADR-//')
            case "$adr_number" in
              [0-9][0-9][0-9]) ;;
              *)
                echo "ADR filename must use a three-digit number: $adr"
                exit 1
                ;;
            esac
            adr_padded=$(printf '%03d' "$adr_expected")
            if [ "$adr_number" != "$adr_padded" ]; then
              echo "ADR numbering is not contiguous: expected ADR-$adr_padded.md, found $adr"
              exit 1
            fi
            if ! head -n 1 "$adr" | grep -q "^# ADR-$adr_number"; then
              echo "ADR $adr must start with a '# ADR-$adr_number' heading"
              exit 1
            fi
            adr_expected=$((adr_expected + 1))
            adr_count=$((adr_count + 1))
          done
          if [ "$adr_count" -lt "$ADR_MIN_COUNT" ]; then
            echo "Expected at least $ADR_MIN_COUNT ADRs, found $adr_count"
            exit 1
          fi
          echo "ADR validation passed ($adr_count ADRs, ADR-001..ADR-$(printf '%03d' "$adr_count"))"
          echo "Documentation validation passed"
