name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app tests

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy simulator tests

      - name: Test
        run: pytest

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate documentation structure
        run: |
          test -f README.md
          test -f docs/architecture/SYSTEM_ARCHITECTURE.md
          test -f docs/DOMAIN_MODEL.md
          test -f docs/AGENT_CONTRACTS.md
          test -f docs/API_CONTRACT.md
          test -f docs/TESTING_STRATEGY.md
          test -f docs/ROADMAP.md
          test -f docs/SIMULATOR.md
          adr_count=$(ls docs/adr/ADR-*.md 2>/dev/null | wc -l)
          if [ "$adr_count" -ne 10 ]; then
            echo "Expected 10 ADRs, found $adr_count"
            exit 1
          fi
          echo "Documentation validation passed"
