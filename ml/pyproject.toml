[project]
name = "industrial-ai-control-tower-ml"
version = "0.1.0"
description = "Reproducible synthetic motor diagnosis training and evaluation pipeline."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["industrial_ml*", "tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = false
warn_return_any = true
warn_unused_configs = true
exclude = ['\.venv', 'data', 'output', 'artifacts']
mypy_path = ["../backend", "../simulator"]

[[tool.mypy.overrides]]
module = ["joblib", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
