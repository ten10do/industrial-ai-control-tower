[project]
name = "industrial-ai-control-tower-backend"
version = "0.1.0"
description = "Backend API for the Industrial AI Control Tower."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.4",
    "aiomqtt>=2.3.0",
    "asyncua==2.0.1",
    "pymodbus==3.15.0",
    "numpy==2.2.6",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
    "pgvector==0.4.1",
    "pypdf==6.16.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]>=3.2.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "app*", "tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ['\.venv', 'build', 'dist']

[[tool.mypy.overrides]]
module = [
    "joblib",
    "sklearn",
    "pypdf",
    "pgvector.*",
    "langgraph.*",
    "asyncpg",
    "pgserver",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
